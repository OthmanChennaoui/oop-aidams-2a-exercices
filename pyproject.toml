[project]
name = "oop-aidams-2a-exercices"
version = "1.0.0"
description = "Exercices du cours OOP & Design patterns in Python (AIDAMS 2A)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Les dossiers d'exercices commencent par un chiffre : ce ne sont pas des
# packages importables, on les ajoute donc directement au sys.path.
pythonpath = [
    "03_oop",
    "04_uml",
    "05_design_patterns/creational",
    "05_design_patterns/structural",
    "05_design_patterns/behavioral",
    "06_testing",
]
addopts = "-m 'not slow'"
markers = [
    "slow: tests lents / appels réseau réels (pytest -m slow)",
]

[tool.coverage.run]
source = ["03_oop", "04_uml", "05_design_patterns", "06_testing"]
omit = ["tests/*"]
