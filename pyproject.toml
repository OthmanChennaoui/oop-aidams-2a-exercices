[project]
name = "oop-aidams-2a-exercices"
version = "1.0.0"
description = "Exercises for the OOP & Design patterns in Python course (AIDAMS 2A)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The exercise folders start with a digit: they are not importable
# packages, so they are added to sys.path directly.
pythonpath = [
    "03_oop",
    "04_uml",
    "05_design_patterns/creational",
    "05_design_patterns/structural",
    "05_design_patterns/behavioral",
    "06_testing",
]
addopts = "-m 'not slow'"
filterwarnings = [
    # Starlette's TestClient still works with httpx; it only nudges towards httpx2.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "slow: slow tests / real network calls (pytest -m slow)",
]

[tool.coverage.run]
source = ["03_oop", "04_uml", "05_design_patterns", "06_testing"]
omit = ["tests/*"]
